services:
  redis:
    image: redis:7.2-alpine
    container_name: tim-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - tim_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  zookeeper:
    image: zookeeper:3.9
    container_name: tim-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_TICK_TIME: 2000
      ZOO_INIT_LIMIT: 10
      ZOO_SYNC_LIMIT: 5
    volumes:
      - tim_zookeeper_data:/data
      - tim_zookeeper_datalog:/datalog
    healthcheck:
      test: ["CMD-SHELL", "printf ruok | nc -w 2 127.0.0.1 2181 | grep -q imok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: tim-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: tim
      MYSQL_USER: tim
      MYSQL_PASSWORD: tim
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - tim_mysql_data:/var/lib/mysql
      - ./script/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: tim-rocketmq-namesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9876"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: tim-rocketmq-broker
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    ports:
      - "10911:10911"
    command: sh mqbroker
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10911"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  tim-node-1:
    build:
      context: .
      dockerfile: Dockerfile.tim-server
    container_name: tim-node-1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    environment:
      TIM_SERVER_ID: im-server-1
      TIM_NODE_ID: "1"
      TIM_SERVER_HTTP_PORT: "8081"
      TIM_SERVER_NETTY_PORT: "9001"
      TIM_ZOOKEEPER_ADDR: zookeeper:2181
      TIM_REDIS_HOST: redis
      TIM_MYSQL_URL: jdbc:mysql://mysql:3306/tim?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      TIM_MYSQL_USER: tim
      TIM_MYSQL_PASSWORD: tim
      TIM_FLYWAY_ENABLED: "true"
      TIM_MQ_MODE: rocketmq
      TIM_ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
    ports:
      - "8081:8081"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  tim-node-2:
    build:
      context: .
      dockerfile: Dockerfile.tim-server
    container_name: tim-node-2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    environment:
      TIM_SERVER_ID: im-server-2
      TIM_NODE_ID: "2"
      TIM_SERVER_HTTP_PORT: "8082"
      TIM_SERVER_NETTY_PORT: "9002"
      TIM_ZOOKEEPER_ADDR: zookeeper:2181
      TIM_REDIS_HOST: redis
      TIM_MYSQL_URL: jdbc:mysql://mysql:3306/tim?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      TIM_MYSQL_USER: tim
      TIM_MYSQL_PASSWORD: tim
      TIM_FLYWAY_ENABLED: "true"
      TIM_MQ_MODE: rocketmq
      TIM_ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
    ports:
      - "8082:8082"
      - "9002:9002"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  tim_redis_data:
  tim_zookeeper_data:
  tim_zookeeper_datalog:
  tim_mysql_data:
