spring.application.name=tim-server
# web port
server.port=${TIM_SERVER_HTTP_PORT:8082}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
# tim netty服务端口
tim.server.port=${TIM_SERVER_NETTY_PORT:9002}
tim.server.id=${TIM_SERVER_ID:im-server-1}
tim.connect-token.secret=${TIM_CONNECT_TOKEN_SECRET:demo-only-change-me}
tim.server.host=${TIM_SERVER_HOST:127.0.0.1}
tim.node.id=${TIM_NODE_ID:1}
logging.level.root=info
# 是否注册 zk
app.zk.switch=true
# zk 地址
app.zk.addr=${TIM_ZOOKEEPER_ADDR:127.0.0.1:2181}
# zk 连接超时时限
app.zk.connect.timeout=15000
# zk 注册根节点
app.zk.root=/im/servers
# gateway url suggested that this is Nginx address
tim.gateway.url=${TIM_GATEWAY_URL:http://localhost:8090/}
# 检测多少秒没有收到客户端心跳后服务端关闭连接 单位秒
tim.heartbeat.time=30
spring.data.redis.host=${TIM_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${TIM_REDIS_PORT:6379}
spring.datasource.url=${TIM_MYSQL_URL:jdbc:h2:mem:tim;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TIM_MYSQL_USER:sa}
spring.datasource.password=${TIM_MYSQL_PASSWORD:}
spring.sql.init.mode=${TIM_SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=false
spring.flyway.enabled=${TIM_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
tim.delivery.max-retries=3
tim.message.max-content-length=65536
tim.delivery.retry-ms=5000
tim.delivery.scan-ms=1000
tim.outbox.scan-ms=1000
tim.outbox.max-retries=10
tim.offline.max-size=1000
tim.offline.rebuild-ms=60000
tim.group.write-fanout-limit=500
tim.mq.mode=${TIM_MQ_MODE:local}
tim.mq.namesrv=${TIM_ROCKETMQ_NAMESRV:127.0.0.1:9876}
