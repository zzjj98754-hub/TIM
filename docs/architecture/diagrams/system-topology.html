<!doctype html><meta charset="utf-8"><title>系统拓扑</title><style>body{font:15px Arial,'Microsoft YaHei';margin:24px}svg{max-width:100%;border:1px solid #ccd} .n{fill:#e8f2ff;stroke:#2878b5;stroke-width:2;cursor:pointer}.s{fill:#eef9ed;stroke:#4b9b55;stroke-width:2;cursor:pointer}.on{fill:#ffd98a}text{font-family:Arial,'Microsoft YaHei';font-size:14px}.a{stroke:#555;stroke-width:2;marker-end:url(#m)}</style><h1>系统拓扑</h1><p>点击节点查看证据。蓝色控制/连接面，绿色存储/基础设施。</p><svg width="980" height="310" viewBox="0 0 980 310"><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0L8,3L0,6z"/></marker></defs><text x="25" y="30" style="font-size:20px">系统拓扑（E-ZK / E-LOGIN / E-RMS）</text><g data-e="E-LOGIN"><rect class="n" x="30" y="110" width="130" height="60"/><text x="66" y="145">Client 集群</text></g><g data-e="E-LOGIN"><rect class="n" x="230" y="110" width="130" height="60"/><text x="260" y="145">Gateway</text></g><g data-e="E-BOOT"><rect class="n" x="440" y="55" width="150" height="60"/><text x="458" y="90">IM Server 1..N</text></g><g data-e="E-ZK"><rect class="s" x="440" y="195" width="150" height="60"/><text x="477" y="230">ZooKeeper</text></g><g data-e="E-RMS"><rect class="s" x="700" y="55" width="100" height="60"/><text x="731" y="90">Redis</text></g><g data-e="E-HISTORY"><rect class="s" x="700" y="125" width="100" height="60"/><text x="731" y="160">MySQL</text></g><g data-e="E-MQ"><rect class="s" x="700" y="195" width="160" height="60"/><text x="724" y="230">RocketMQ（可选）</text></g><path class="a" d="M160 140H230M360 140H440M515 115V195M590 85H700M590 145H700M590 225H700"/></svg><p id="d">选择节点。</p><script>document.querySelectorAll('g[data-e]').forEach(g=>g.onclick=()=>{document.querySelectorAll('rect').forEach(x=>x.classList.remove('on'));g.querySelector('rect').classList.add('on');d.innerHTML='证据：<a href="../evidence-index.md#'+g.dataset.e.toLowerCase()+'">'+g.dataset.e+'</a>'})</script>
