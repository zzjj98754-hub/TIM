<svg xmlns="http://www.w3.org/2000/svg" width="950" height="250"><style>text{font-family:Arial,'Microsoft YaHei';font-size:14px}.n{fill:#e8f2ff;stroke:#2878b5;stroke-width:2}.p{fill:#fff0d8;stroke:#bd7b00;stroke-width:2}.a{stroke:#555;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0L8,3L0,6z"/></marker></defs><text x="25" y="30" font-size="20">ACK / 重试生命周期（E-RMS）</text><rect class="n" x="30" y="105" width="130" height="50"/><text x="54" y="136">Channel write</text><rect class="n" x="220" y="105" width="130" height="50"/><text x="243" y="136">pending Map</text><rect class="p" x="415" y="105" width="140" height="50"/><text x="436" y="136">每 1s 扫描</text><rect class="n" x="620" y="50" width="140" height="50"/><text x="650" y="81">ACK → ACKED</text><rect class="p" x="620" y="165" width="150" height="50"/><text x="645" y="196">3 次后 offline</text><path class="a" d="M160 130H220M350 130H415M555 115L620 75M555 145L620 190M480 105V75H620"/><text x="475" y="70">5s 未 ACK → dispatch</text></svg>
