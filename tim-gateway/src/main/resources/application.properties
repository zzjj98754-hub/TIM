spring.application.name=tim-gateway
# web port
server.port=${TIM_GATEWAY_HTTP_PORT:8090}
logging.level.root=info
# zk 地址
app.zk.addr=${TIM_ZOOKEEPER_ADDR:127.0.0.1:2181}
# zk 连接超时时限
app.zk.connect.timeout=15000
# zk 注册根节点
app.zk.root=/im/servers
#路由策略，轮询
app.route.way=com.tuling.tim.common.route.algorithm.loop.LoopHandle
# Redis 配置
spring.redis.host=${TIM_REDIS_HOST:127.0.0.1}
spring.redis.port=${TIM_REDIS_PORT:6379}
spring.redis.database=1
tim.connect-token.secret=${TIM_CONNECT_TOKEN_SECRET:}
tim.connect-token.ttl-ms=${TIM_CONNECT_TOKEN_TTL_MS:60000}
spring.redis.jedis.pool.max-active=100
spring.redis.jedis.pool.max-idle=100
spring.redis.jedis.pool.max-wait=1000
spring.redis.jedis.pool.min-idle=10
# spring.redis.password=xx
