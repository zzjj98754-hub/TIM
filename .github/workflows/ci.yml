name: TIM CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven test
        run: ./mvnw -q test
      - name: Maven verify
        run: ./mvnw -q verify -DskipTests
      - name: Validate Compose model
        run: docker compose config
